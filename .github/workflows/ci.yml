name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22.13"
  # Test-only values — never real secrets. loadEnv()'s production guard
  # (infra/config/env.ts) only rejects these placeholder values when
  # NODE_ENV=production, which CI never sets, so this is safe to keep inline
  # rather than wired through repo secrets.
  DATABASE_URL: "postgresql://handly:handly_ci_pw@localhost:5432/handly?schema=public"
  REDIS_URL: "redis://localhost:6379"
  JWT_ACCESS_SECRET: "ci-test-access-secret-not-for-prod-use-only"
  FIELD_ENCRYPTION_KEY: "ci-test-encryption-key-not-for-prod!!"
  WEB_ORIGIN: "http://localhost:3000"
  NODE_ENV: "test"

jobs:
  install:
    name: Install & cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies (frozen lockfile — fails the build on any drift)
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # turbo's "lint" pipeline depends on "^build" (turbo.json), so
      # @handly/contracts builds first automatically — no manual step needed.
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test (with Postgres/PostGIS + Redis)
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: handly
          POSTGRES_PASSWORD: handly_ci_pw
          POSTGRES_DB: handly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handly -d handly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @handly/contracts build
      - name: Apply migrations
        run: pnpm --filter @handly/api exec prisma migrate deploy
      - name: Run API test suite
        run: pnpm --filter @handly/api test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  security-scan:
    name: Dependency & security scan
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails the build on any high/critical advisory in the dependency tree.
      # Moderate/low findings are reported but don't block — triage those in
      # the launch checklist (docs/runbooks/launch-checklist.md), not here.
      - name: pnpm audit (high+ severity fails the build)
        run: pnpm audit --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
