packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true

# Standard pnpm (>=10) approval list so a fresh clone builds native/codegen deps
# without an interactive `pnpm approve-builds` prompt.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - esbuild
  - prisma
  - sharp
